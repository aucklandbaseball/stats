<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABA League Stats</title>
<meta name="description" content="Auckland Baseball Association league stats and leaderboards, updated weekly from GameChanger.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="masthead">
  <div class="wrap masthead-inner">
    <a class="brand" href="#">
      <span class="brand-org">Auckland Baseball</span>
      <span class="brand-title">League Stats</span>
    </a>
    <label class="season-picker">
      <span class="sr-only">Season</span>
      <select id="season"></select>
    </label>
  </div>
</header>
<div class="wrap">
  <nav class="divisions" id="divisions" aria-label="Division"></nav>
  <nav class="tabs" id="tabs" aria-label="Stats category"></nav>
</div>
<main class="wrap" id="main"><p class="notice">Loading stats…</p></main>
<footer class="wrap footer" id="footer"></footer>
<script src="assets/app.js"></script>
</body>
</html>
